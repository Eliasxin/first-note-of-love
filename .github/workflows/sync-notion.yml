
name: Sync Notion Chapters

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notion-chapter-publishing
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Notion configuration
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "::error::Missing NOTION_TOKEN secret"
            exit 1
          fi

          if [ -z "$NOTION_DATABASE_ID" ]; then
            echo "::error::Missing NOTION_DATABASE_ID secret"
            exit 1
          fi

          echo "Notion configuration is present."

      - name: Generate chapters from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          SYNC_WRITE: 'true'
        run: node scripts/sync-notion.mjs

      - name: Validate generated chapters
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const chapters = JSON.parse(
            fs.readFileSync('data/chapters.json', 'utf8')
          );

          if (!Array.isArray(chapters)) {
            throw new Error('Chapter data must be an array.');
          }

          if (chapters.length !== 33) {
            throw new Error(
              `Expected 33 chapters, got ${chapters.length}.`
            );
          }

          const ids = new Set();
          const orders = new Set();

          for (const chapter of chapters) {
            if (
              chapter.published !== true ||
              chapter.status !== '已發布'
            ) {
              throw new Error('Unapproved chapter detected.');
            }

            if (
              !chapter.id ||
              !chapter.title?.trim() ||
              !chapter.content?.trim()
            ) {
              throw new Error('Incomplete chapter detected.');
            }

            if (
              !Number.isFinite(chapter.order) ||
              !Array.isArray(chapter.cp) ||
              !['一般', '18+'].includes(chapter.rating)
            ) {
              throw new Error('Invalid chapter metadata.');
            }

            if (ids.has(chapter.id)) {
              throw new Error('Duplicate chapter ID.');
            }

            if (orders.has(chapter.order)) {
              throw new Error('Duplicate chapter order.');
            }

            ids.add(chapter.id);
            orders.add(chapter.order);
          }

          console.log(
            `Validated ${chapters.length} chapters.`
          );
          NODE

      - name: Commit published chapters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/chapters.json

          if git diff --cached --quiet; then
            echo "No chapter changes to publish."
            exit 0
          fi

          git commit -m "Publish Notion chapters"
          git push origin HEAD:main
