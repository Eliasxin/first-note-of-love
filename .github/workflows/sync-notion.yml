
name: Sync Notion Chapters

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Notion configuration
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "::error::Missing NOTION_TOKEN secret"
            exit 1
          fi

          if [ -z "$NOTION_DATABASE_ID" ]; then
            echo "::error::Missing NOTION_DATABASE_ID secret"
            exit 1
          fi

          echo "Notion configuration is present."

      - name: Test Notion chapter sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          SYNC_WRITE: 'false'
        run: node scripts/sync-notion.mjs

      - name: Confirm dry run
        run: |
          echo "Dry run completed."
          echo "No website chapter data was published."
